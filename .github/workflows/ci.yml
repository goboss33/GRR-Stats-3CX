name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Type-check, lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` déclenche le postinstall qui génère les clients Prisma
      # (auth + cdr). Aucune base de données n'est requise pour `prisma generate`.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests unitaires
        run: npm test

      # Le build ne se connecte à aucune base (toutes les pages sont dynamiques) ;
      # des valeurs d'environnement factices suffisent à le faire passer.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          DATABASE_URL_AUTH: postgresql://user:pass@localhost:5432/db
          DATABASE_URL_GEROFINANCE: postgresql://user:pass@localhost:5432/db
          DATABASE_URL_EDIFEA: postgresql://user:pass@localhost:5432/db
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-placeholder-secret-not-used-at-runtime
          AUTH_TRUST_HOST: "true"
