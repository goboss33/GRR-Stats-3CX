version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: callcenter-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: callcenter_auth
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: callcenter-frontend
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/callcenter_gerofinance?connection_limit=10&pool_timeout=20
      - DATABASE_URL_AUTH=postgresql://postgres:postgres@postgres:5432/callcenter_auth?connection_limit=10&pool_timeout=20
      - DATABASE_URL_GEROFINANCE=postgresql://postgres:postgres@postgres:5432/callcenter_gerofinance?connection_limit=10&pool_timeout=20
      - DATABASE_URL_EDIFEA=postgresql://postgres:postgres@postgres:5432/callcenter_edifea?connection_limit=10&pool_timeout=20
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - AUTH_TRUST_HOST=true
      - INTERNAL_API_URL=${INTERNAL_API_URL}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - AUTH_MICROSOFT_ENTRA_ID_ID=${AUTH_MICROSOFT_ENTRA_ID_ID}
      - AUTH_MICROSOFT_ENTRA_ID_SECRET=${AUTH_MICROSOFT_ENTRA_ID_SECRET}
      - AUTH_MICROSOFT_ENTRA_ID_TENANT_ID=${AUTH_MICROSOFT_ENTRA_ID_TENANT_ID}
      - AZURE_GROUP_ADMIN_ID=${AZURE_GROUP_ADMIN_ID}
      - AZURE_GROUP_SUPERUSER_ID=${AZURE_GROUP_SUPERUSER_ID}
      - AZURE_GROUP_MODERATOR_ID=${AZURE_GROUP_MODERATOR_ID}
      - AZURE_GROUP_USER_ID=${AZURE_GROUP_USER_ID}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
