services:
  postgres:
    image: postgres:16-alpine
    container_name: callcenter-db
    # Docker n'accorde que 64 Mo de /dev/shm par défaut : les plans parallèles
    # de Postgres (workers, hash joins) y allouent leurs segments et échouent
    # en « could not resize shared memory segment » sur les grosses requêtes.
    shm_size: "1gb"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: callcenter_auth
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    # Watchtower (présent sur le serveur de prod) ne doit JAMAIS redémarrer la
    # base de son propre chef — mises à jour Postgres uniquement volontaires.
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Cf. frontend/Dockerfile : garde les identifiants d'actions serveur
        # stables entre les builds — les onglets déjà ouverts survivent aux
        # redéploiements. Génération : openssl rand -base64 32
        - NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}
    container_name: callcenter-frontend
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/callcenter_gerofinance?connection_limit=10&pool_timeout=20
      - DATABASE_URL_AUTH=postgresql://postgres:postgres@postgres:5432/callcenter_auth?connection_limit=10&pool_timeout=20
      - DATABASE_URL_GEROFINANCE=postgresql://postgres:postgres@postgres:5432/callcenter_gerofinance?connection_limit=10&pool_timeout=20
      - DATABASE_URL_EDIFEA=postgresql://postgres:postgres@postgres:5432/callcenter_edifea?connection_limit=10&pool_timeout=20
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - AUTH_TRUST_HOST=true
      - INTERNAL_API_URL=${INTERNAL_API_URL}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - AUTH_MICROSOFT_ENTRA_ID_ID=${AUTH_MICROSOFT_ENTRA_ID_ID}
      - AUTH_MICROSOFT_ENTRA_ID_SECRET=${AUTH_MICROSOFT_ENTRA_ID_SECRET}
      - AUTH_MICROSOFT_ENTRA_ID_TENANT_ID=${AUTH_MICROSOFT_ENTRA_ID_TENANT_ID}
      - AZURE_GROUP_ADMIN_ID=${AZURE_GROUP_ADMIN_ID}
      - AZURE_GROUP_MODERATOR_ID=${AZURE_GROUP_MODERATOR_ID}
      - AZURE_GROUP_MANAGER_ID=${AZURE_GROUP_MANAGER_ID}
      - AZURE_GROUP_AGENT_ID=${AZURE_GROUP_AGENT_ID}
      # Anciens noms, encore acceptés en repli si les nouveaux ne sont pas définis.
      - AZURE_GROUP_SUPERUSER_ID=${AZURE_GROUP_SUPERUSER_ID}
      - AZURE_GROUP_USER_ID=${AZURE_GROUP_USER_ID}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # Image construite localement : hors de portée de Watchtower, et on
    # déploie par « pull and redeploy » volontaire, jamais automatique.
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

volumes:
  postgres_data:
